
# cargo-vet audits file

[criteria.safe-to-deploy-for-serial-readiness]
description = "The dependency meets the safe-to-deploy requirements for its Unix serial-readiness use in async-serialport. The review covers the configured features and reachable descriptor duplication, polling, and cleanup code. Expanding that use requires a new review."

[[audits.async-serialport]]
who = "Codex (AI-assisted)"
criteria = "safe-to-deploy"
version = "0.2.0"
notes = "AI-assisted local source review of async-serialport 0.2.0: runtime-agnostic async I/O wrappers around a worker-owned serial port using channels; split returns a worker future for caller-selected spawning, the crate denies unsafe code through lints and contains no unsafe blocks, no network/process execution, and filesystem/device access is delegated to the caller-provided serialport implementation."

[[audits.async-serialport]]
who = "Codex (AI-assisted)"
criteria = "safe-to-deploy"
version = "0.4.0"
notes = "AI-assisted local source review of async-serialport 0.4.0. The worker performs I/O on the caller-provided port and transfers it exclusively through a guard with a reserved channel slot for return. The native readiness helper polls the port descriptor and a private Unix socket pair for cancellation. The worker stops and joins that helper before releasing the port. The timed fallback uses a sleeping thread and receives no device handle. Reviewed the crate manifest and library sources for unsafe code, filesystem access, external network connections, and process execution. The crate contains no unsafe code, build script, or access beyond the supplied serial port and private socket pair."

[[audits.async-serialport]]
who = "Codex (AI-assisted)"
criteria = "safe-to-deploy"
delta = "0.4.0 -> 0.4.1"
notes = "Compared the published 0.4.0 package with the 0.4.1 source, tests, and manifests. Reads, writes, and flushes use Tokio try_send when capacity is available and retain the existing queued send when full. Closed channels still produce BrokenPipe and the serial-port guard keeps its reserved return slot. No unsafe code, ambient capabilities, or dependency changes were introduced."

[[audits.bitflags]]
who = "Lukasz Anforowicz <lukasza@chromium.org>"
criteria = "safe-to-deploy"
version = "1.3.2"
notes = """
Imported from Google's cargo-vet audit set in the cached imports.lock.

Security review of earlier versions of the crate can be found at
(Google-internal, sorry): go/image-crate-chromium-security-review

The crate exposes a function marked as `unsafe`, but doesn't use any
`unsafe` blocks (except for tests of the single `unsafe` function).  I
think this justifies marking this crate as `ub-risk-1`.

Additional review comments can be found at https://crrev.com/c/4723145/31
"""

