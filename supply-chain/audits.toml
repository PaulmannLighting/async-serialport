[[audits.filedescriptor]]
who = "Codex (AI-assisted)"
criteria = "safe-to-deploy-for-serial-readiness"
version = "0.8.3"
importable = false
notes = "Reviewed the Unix OwnedHandle duplication, borrow and drop paths. Duplication uses F_DUPFD_CLOEXEC and falls back to dup followed by setting close-on-exec on kernels that reject the atomic operation. On error, the owned duplicate closes before returning. The borrow is tied to that handle and the helper closes it when finished. The crate has no build script. This audit covers OwnedHandle::dup on the caller's live TTY and subsequent descriptor borrowing and cleanup."

