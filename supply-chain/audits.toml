[[audits.tokio]]
who = "Codex (AI-assisted)"
criteria = "safe-to-deploy"
delta = "1.52.3 -> 1.54.1"
notes = "Reviewed the published runtime, synchronization, I/O and manifest changes. Semaphore waiters remain pinned and queued state is protected, with waker callbacks moved outside the lock. The MPSC changes preserve slot ownership and handle index wraparound. Readiness registration retains the owning registration until deferred driver release, and the optional io_uring submission path keeps kernel-visible buffers owned after a partial submission. Timer entries retain the runtime handle in 1.54.1, reverting the interval race introduced in 1.54.0. OS I/O remains behind the corresponding features and caller-selected operations. Rechecked the enabled runtime, time, sync and I/O paths with the crate integration tests."

